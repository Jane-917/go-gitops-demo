name: Go Microservice CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    # 1. 簽出程式碼
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. 將 Repository 名稱強制轉為小寫（解決 GHCR 大寫報錯問題）
    - name: Downcase repository name
      run: |
        echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

    # 3. 設定 Go 環境
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    # 4. 執行 CI 單元測試
    - name: Run Unit Tests
      run: go test -v ./...

    # 5. 登入 GitHub Container Registry (GHCR)
    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # 6. 建置並推送 Docker 映像檔（使用小寫的 REPO_LOWER）
    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ghcr.io/${{ env.REPO_LOWER }}:${{ github.sha }}
          ghcr.io/${{ env.REPO_LOWER }}:latest

    # 7. 動態更新 Kubernetes 部署清單中的映像檔標籤
    - name: Update Kubernetes Manifests
      run: |
        sed -i 's|image: ghcr.io/.*:.*|image: ghcr.io/${{ env.REPO_LOWER }}:${{ github.sha }}|g' k8s/deployment.yaml

    # 8. 提交並將更新後的 YAML 推送回 Repository
    - name: Commit and Push Manifest Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git commit -am "chore(k8s): update image tag to ${{ github.sha }}" || echo "No changes to commit"
        git push