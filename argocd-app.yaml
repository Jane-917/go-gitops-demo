apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: go-gitops-demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/Jane-917/go-gitops-demo.git'
    targetRevision: HEAD
    path: k8s
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true