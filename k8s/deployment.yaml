apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-gitops-demo
  namespace: default
  labels:
    app: go-gitops-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: go-gitops-demo
  template:
    metadata:
      labels:
        app: go-gitops-demo
    spec:
      containers:
      - name: go-gitops-demo
        image: ghcr.io/your-github-id/go-gitops-demo:IMAGE_TAG
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "250m"
            # GitHub Actions 裡面的範例步驟
- name: Update image tag in Kubernetes Manifest
  run: |
    sed -i 's/IMAGE_TAG/${{ github.sha }}/g' k8s/deployment.yaml