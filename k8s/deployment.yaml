apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-gitops-demo
  namespace: default
  labels:
    app: go-gitops-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: go-gitops-demo
  template:
    metadata:
      labels:
        app: go-gitops-demo
    spec:
      containers:
      - name: go-gitops-demo
        image: ghcr.io/jane-917/go-gitops-demo:e06363166306f58a7d77db5e8bf19226a50de4ba
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "250m"
