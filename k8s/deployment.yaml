apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-gitops-demo
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: go-gitops-demo
  template:
    metadata:
      labels:
        app: go-gitops-demo
    spec:
      containers:
      - name: go-gitops-demo
        image: go-gitops-demo:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"